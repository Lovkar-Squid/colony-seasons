# Seeded by tools/probe.sh cswand lights: the documented defaults, with the street lights switched on (Q11).

[calendar]
	yearLengthDays = 48
	startSeason = "auto"
	useSereneSeasons = true
	timeZone = "system"

[festivals]

	[festivals.winter_festival]
		enabled = true
		decorFrom = "12-01"
		decorUntil = "01-06"
		daysFrom = "12-24"
		daysUntil = "12-26"

	[festivals.new_year]
		enabled = true
		decorFrom = "12-31"
		decorUntil = "01-01"
		daysFrom = "12-31"
		daysUntil = "01-01"

[decorator]
	needsMaterials = true
	buildingsPerDayBase = 2
	buildingsPerDayPerLevel = 2
	maxPerSide = 6
	storeroomDressing = true
	streetLights = true

[events]
	gatherFromTick = 8500
	gatherUntilTick = 10500
	whoComes = "everyone_once_a_day"
	midnightShow = true
	giftsPerPlayerPerDay = 1

[effects]
	festivalHappiness = false
	festivalHappinessBonus = 1.0
	winterCropSlowdown = false
	winterCropSkipChance = 0.5
	winterFoodNeed = false
	winterFoodNeedFactor = 1.25

[links]
	showWelcome = true

[compat]
	tradePostBridge = true
