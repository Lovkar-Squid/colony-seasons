# Seeded by tools/probe.sh csfullcycle effects (see the diff against tools/cseffects/rigconfig-off).
# The strengths are the documented defaults, so the probe's targets are the design's (a quarter more food, half the growth steps).

[calendar]
	yearLengthDays = 48
	startSeason = "auto"
	useSereneSeasons = true
	timeZone = "system"

[festivals]

	[festivals.winter_festival]
		enabled = true
		decorFrom = "12-01"
		decorUntil = "01-06"
		daysFrom = "12-24"
		daysUntil = "12-26"

	[festivals.new_year]
		enabled = true
		decorFrom = "12-31"
		decorUntil = "01-01"
		daysFrom = "12-31"
		daysUntil = "01-01"

[decorator]
	needsMaterials = true
	buildingsPerDayBase = 2
	buildingsPerDayPerLevel = 2
	maxPerSide = 6

[events]
	gatherFromTick = 8500
	gatherUntilTick = 10500
	whoComes = "everyone_once_a_day"
	midnightShow = true
	giftsPerPlayerPerDay = 1

[effects]
	festivalHappiness = true
	festivalHappinessBonus = 1.0
	winterCropSlowdown = true
	winterCropSkipChance = 0.5
	winterFoodNeed = true
	winterFoodNeedFactor = 1.25
