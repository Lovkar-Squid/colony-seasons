[[mods]]
modId="colony_seasons"
version="0.1.0-beta.1"
displayName="Colony Seasons"
description='''Seasons and festivals for MineColonies. The colony follows a calendar: a new worker, the Decorator, dresses the buildings and a tree on the square for the Winter Festival and takes it all down afterwards, colonists dress for the season and gather at the tree, and the player gets gifts and New Year fireworks. Work in progress. Made by Lovkar & Claude.'''
authors="Lovkar & Claude"
displayURL="https://github.com/Lovkar-Squid/colony-seasons"

