[[mods]]
modId="colony_seasons"
version="0.1.0-beta.1"
displayName="Colony Seasons"
description='''Seasons and festivals for MineColonies. The game has seasons, and the festivals come on real dates. In December a new worker, the Decorator, hangs wreaths and garlands on the colony's buildings and builds a decorated tree on the square, colonists put on striped scarves and gather at the tree, the player gets a small gift every day, and New Year ends with fireworks. After 6 January the Decorator takes it all down. Effects on the game exist and are off by default. Made by Lovkar & Claude. Thank you for playing! News, help and test builds on Discord: https://discord.gg/BVztrTtXFu. Support the mods on Patreon: https://www.patreon.com/cw/Lovkar.'''
authors="Lovkar & Claude"
displayURL="https://github.com/Lovkar-Squid/colony-seasons"
logoFile="colony_seasons_logo.png"

